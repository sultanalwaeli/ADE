
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نبض الإجادة | مدرسة أبو الدرداء</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07182b;--panel:#102943;--panel2:#153553;
  --line:#ffffff20;--text:#f5f9ff;--muted:#acc4d7;
  --gold:#efc775;--cyan:#61d7e4;--green:#76e1b1;
  --red:#ffa8a8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Cairo,Tahoma,sans-serif}
button,input{font-family:inherit}
button{cursor:pointer}
header{
  position:sticky;top:0;z-index:20;
  background:#07182bed;backdrop-filter:blur(16px);
  border-bottom:1px solid var(--line);
  padding:14px 4%;
}
.head{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px}
.logo{
  width:54px;height:54px;border-radius:16px;
  display:grid;place-items:center;font-size:27px;
  background:linear-gradient(135deg,#164b69,#188ca1);
  border:1px solid #ffffff40;
}
.brand strong{display:block;font-size:20px}
.brand small{color:var(--muted)}
.actions{display:flex;gap:9px;flex-wrap:wrap}
.btn{
  background:#ffffff12;color:white;border:1px solid #ffffff30;
  border-radius:12px;padding:10px 16px;font-weight:800;
}
.btn:hover{background:#ffffff24}
.btn.primary{background:linear-gradient(135deg,#0f829b,#145d8b);border:0}
nav{display:flex;gap:9px;overflow-x:auto;padding-top:15px}
nav button{
  white-space:nowrap;border:1px solid var(--line);
  color:var(--muted);background:#ffffff08;
  padding:10px 16px;border-radius:12px;font-weight:800;
}
nav button.active{background:#196b85;color:#fff;border-color:#53c8dc}
main{max-width:1400px;margin:auto;padding:28px 4% 70px}
.hero{
  border:1px solid #ffffff25;border-radius:26px;padding:36px;
  background:
  radial-gradient(circle at 15% 20%,#168b9b55,transparent 35%),
  linear-gradient(135deg,#153b5d,#0a2038 75%);
  margin-bottom:22px;position:relative;overflow:hidden;
}
.kicker{color:var(--gold);font-size:13px;font-weight:900;letter-spacing:2px}
h1{font-size:clamp(27px,4vw,48px);margin:8px 0 12px;line-height:1.5}
h2{font-size:22px;margin:0 0 14px;color:#fff}
h3{margin:0 0 10px;font-size:17px;color:var(--gold)}
p{line-height:2;margin:7px 0;color:var(--muted)}
.hero p{font-size:17px;max-width:850px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:18px 0}
.card{
  background:linear-gradient(145deg,var(--panel),#0b2138);
  border:1px solid var(--line);border-radius:20px;padding:22px;
  margin-bottom:16px;min-width:0;
}
.stat{text-align:center}
.stat strong{display:block;font-size:35px;color:var(--cyan);line-height:1.5}
.stat span{font-size:13px;color:var(--muted)}
.info-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.info{
  background:#ffffff08;border:1px solid var(--line);
  padding:15px;border-radius:14px;min-width:0;
}
.info small{display:block;color:var(--muted);margin-bottom:7px}
.info strong{display:block;overflow-wrap:anywhere;line-height:1.8;font-size:15px}
.section-label{
  color:var(--cyan);font-size:13px;font-weight:900;
  margin-bottom:12px;letter-spacing:1px;
}
.domain-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}
.domain-card{
  background:linear-gradient(140deg,#163c58,#0c263e);
  border:1px solid #ffffff27;border-radius:19px;padding:22px;
}
.domain-card h3{font-size:20px;color:white}
.counters{display:flex;gap:12px;flex-wrap:wrap;margin:15px 0}
.pill{background:#ffffff12;border-radius:50px;padding:7px 13px;font-size:13px}
.pill.good{color:var(--green)}
.pill.warn{color:var(--gold)}
.entries{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:17px}
.entry{
  border:1px solid var(--line);background:#ffffff08;
  padding:18px;border-radius:16px;margin-bottom:12px;
}
.entry p{color:white;white-space:pre-wrap;overflow-wrap:anywhere}
.evidence{
  border-right:3px solid var(--cyan);
  margin-top:12px;padding:9px 13px;
  background:#ffffff08;color:var(--muted);
  border-radius:7px;font-size:13px;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.empty{color:var(--muted);padding:22px;text-align:center;border:1px dashed #ffffff35;border-radius:15px}
.status{font-size:12px;color:var(--muted)}
.footer{text-align:center;padding:30px;color:var(--muted);font-size:13px}
.loading{padding:40px;text-align:center;font-size:20px}
.fullscreen header{position:relative}
.fullscreen main{max-width:1650px}
.fullscreen .hero{padding:55px}
.fullscreen .card{padding:30px}
@media(max-width:900px){
 .grid{grid-template-columns:repeat(2,1fr)}
 .info-grid{grid-template-columns:repeat(2,1fr)}
 .entries,.domain-grid{grid-template-columns:1fr}
}
@media(max-width:550px){
 .grid,.info-grid{grid-template-columns:1fr}
 .hero{padding:23px}
 .card{padding:17px}
 .brand strong{font-size:16px}
}
@media print{
 header .actions,nav,.btn{display:none!important}
 body{background:white;color:black}
 .card,.hero,.entry,.domain-card{background:white;color:black;border:1px solid #ccc}
 h1,h2,h3,.entry p{color:black}
 p{color:#444}
}
</style>
</head>
<body>

<header>
 <div class="head">
  <div class="brand">
   <div class="logo">✦</div>
   <div>
    <strong>نبض الإجادة | أبو الدرداء</strong>
    <small>منصة التقويم الذاتي والتميز المؤسسي 2026/2027م</small>
   </div>
  </div>
  <div class="actions">
   <button class="btn" onclick="loadData(true)">↻ تحديث البيانات</button>
   <button class="btn primary" onclick="togglePresentation()">◉ وضع العرض</button>
  </div>
 </div>
 <nav id="nav"></nav>
</header>

<main id="app">
 <div class="loading">جارٍ الاتصال بقاعدة بيانات مدرسة أبو الدرداء...</div>
</main>

<div class="footer">
 مدرسة أبو الدرداء للبنين (5–12) | نبض الإجادة | التقويم الذاتي والتحسين المستمر
 <div class="status" id="status"></div>
</div>

<script>
"use strict";

/* رابط Google Apps Script الخاص بمدرسة أبو الدرداء */
const API_URL =
"https://script.google.com/macros/s/AKfycbwPtbrsr5nRkxh1k-AKQWVgLlSYlUuhPvTo0lGqBkwl97HS9c05F2w_sC-tzUcAvtPN9Q/exec";

const CACHE_KEY="abu_dardaa_excellence_data_v1";

const DOMAIN_NAMES=[
 "الإنجاز الدراسي",
 "النمو الشخصي",
 "التدريس والتقويم",
 "مناخ المدرسة وبيئة التعلم",
 "القيادة والإدارة والحوكمة"
];

let database=null;
let currentPage="identity";
let presentation=false;
let requestNumber=0;

const $=id=>document.getElementById(id);

function escapeHTML(value){
 return String(value??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",
  '"':"&quot;","'":"&#39;"
 })[c]);
}

function normalize(value){
 return String(value??"").trim();
}

function safeLink(value){
 const url=normalize(value);
 try{
  const u=new URL(url);
  return ["https:","http:"].includes(u.protocol)?u.href:"";
 }catch{return "";}
}

function textValue(value){
 const s=normalize(value);
 const url=safeLink(s);
 if(url){
  return `<a href="${escapeHTML(url)}" target="_blank"
   rel="noopener noreferrer" style="color:var(--cyan)">
   فتح الرابط ↗</a>`;
 }
 return escapeHTML(s).replace(/\n/g,"<br>");
}

function getSheet(name){
 return database?.sheets?.[name]||{rows:[],headers:[]};
}

function identityRows(){
 return getSheet("هوية المدرسة").rows||[];
}

function schoolValue(key){
 const rows=identityRows();
 for(const row of rows){
  const val=normalize(row[key]);
  if(val)return val;
 }
 return normalize(database?.school?.[key]);
}

function isFilled(value){
 return normalize(value)!=="";
}

function numberValue(value){
 const n=Number(String(value??"").replace(/,/g,""));
 return Number.isFinite(n)?n:0;
}

function info(label,value){
 if(!isFilled(value))return "";
 return `<div class="info">
  <small>${escapeHTML(label)}</small>
  <strong>${textValue(value)}</strong>
 </div>`;
}

function section(title,content){
 return `<section class="card">
  <h2>${escapeHTML(title)}</h2>${content}
 </section>`;
}

function hero(kicker,title,description){
 return `<div class="hero">
  <div class="kicker">${escapeHTML(kicker)}</div>
  <h1>${escapeHTML(title)}</h1>
  <p>${escapeHTML(description)}</p>
 </div>`;
}

function stat(value,label){
 return `<div class="card stat">
  <strong>${escapeHTML(value)}</strong>
  <span>${escapeHTML(label)}</span>
 </div>`;
}

function getDomains(){
 return DOMAIN_NAMES.map((name,i)=>{
  const domain=(database?.domains||[]).find(d=>d.name===name);
  return domain||{
   id:i+1,name,strengths:[],improvements:[],
   strengthsCount:0,improvementsCount:0
  };
 });
}

function renderNavigation(){
 const items=[
  ["identity","البيانات الأساسية"],
  ["overview","التحليل الذاتي"],
  ...getDomains().map((d,i)=>["domain"+i,d.name])
 ];

 $("nav").innerHTML=items.map(([id,label])=>
  `<button class="${currentPage===id?"active":""}"
   onclick="navigate('${id}')">${escapeHTML(label)}</button>`
 ).join("");
}

function navigate(page){
 currentPage=page;
 render();
 window.scrollTo({top:0,behavior:"smooth"});
}

function renderIdentity(){
 const name=schoolValue("اسم المدرسة")||
 "مدرسة أبو الدرداء للبنين (5–12)";

 const studentCount=schoolValue("عدد الطلبة")||
 schoolValue("عدد الطلاب");

 const lower=schoolValue("عدد طلبة الصفوف 5-8")||
 schoolValue("عدد الطلبة 5-8");

 const upper=schoolValue("عدد طلبة الصفوف 9-12")||
 schoolValue("عدد الطلبة 9-12");

 const count=studentCount||
 ((lower||upper)?String(numberValue(lower)+numberValue(upper)):"");

 const code=schoolValue("الرمز المدرسي")||"7237";
 const year=schoolValue("السنة الدراسية")||"2026/2027";

 let html=hero(
  "01 · SCHOOL PROFILE",
  "البيانات الأساسية للمدرسة",
  "من هنا تبدأ حكاية أبو الدرداء؛ هويتها، ورسالتها، ومجتمعها المدرسي، ومكوناتها ومكنوناتها."
 );

 html+=`<div class="grid">
  ${stat(code,"الرمز المدرسي")}
  ${stat(year,"العام الدراسي")}
  ${stat(count||"—","إجمالي الطلبة")}
  ${stat("5","مجالات التقويم الذاتي")}
 </div>`;

 const basicKeys=[
  "اسم المدرسة","الرمز المدرسي","السنة الدراسية",
  "المديرية","المحافظة","الولاية","القرية",
  "المرحلة أو الصف","نوع المدرسة","نوع المبنى",
  "سنة تشغيل المبنى","سنة إنشاء المدرسة",
  "عدد الشعب","بداية الدوام","نهاية الدوام"
 ];

 html+=section("01 · الهوية والموقع",
  `<div class="info-grid">${
   basicKeys.map(k=>info(k,schoolValue(k))).join("")
  }</div>`
 );

 const peopleKeys=[
  "مدير المدرسة","المدير المساعد",
  "مشرف الإدارة المدرسية","عدد الطلبة",
  "عدد الطلاب","عدد الشعب","المعلمون",
  "المعلمون الأوائل","الاختصاصيون",
  "الفنيون","الهيئة التعليمية",
  "الهيئة الإدارية","عدد المعلمين",
  "عدد الإداريين","عدد الفنيين"
 ];

 html+=section("02 · القيادة والموارد البشرية",
  `<div class="info-grid">${
   peopleKeys.map(k=>info(k,schoolValue(k))).join("")
  }</div>`
 );

 const studentKeys=[
  "عدد الطلبة","عدد الطلاب",
  "عدد طلبة الصفوف 5-8","عدد الطلبة 5-8",
  "عدد طلبة الصفوف 9-12","عدد الطلبة 9-12",
  "الصف الخامس","الصف السادس",
  "الصف السابع","الصف الثامن",
  "الصف التاسع","الصف العاشر",
  "الصف الحادي عشر","الصف الثاني عشر",
  "الطلبة العمانيون","الطلبة غير العمانيين",
  "نسبة الطلبة العمانيين","نسبة غير العمانيين"
 ];

 html+=section("03 · المجتمع الطلابي",
  `<div class="info-grid">${
   studentKeys.map(k=>info(k,schoolValue(k))).join("")
  }</div>`
 );

 const vision=schoolValue("رؤية المدرسة");
 const mission=schoolValue("رسالة المدرسة");
 const intro=schoolValue("نبذة عامة عن المدرسة");

 if(intro){
  html+=section("04 · أبو الدرداء في سطور",
   `<p>${textValue(intro)}</p>`);
 }

 if(vision||mission){
  html+=section("05 · الرؤية والرسالة",
   `${vision?`<h3>رؤية المدرسة</h3><p>${textValue(vision)}</p>`:""}
    ${mission?`<h3>رسالة المدرسة</h3><p>${textValue(mission)}</p>`:""}`
  );
 }

 const strategic=schoolValue("الأهداف الاستراتيجية");
 if(strategic){
  html+=section("06 · الأهداف الاستراتيجية",
   `<p>${textValue(strategic)}</p>`);
 }

 // عرض بقية بيانات الهوية دون إهمال الحقول غير المتوقعة
 const used=new Set([
  ...basicKeys,...peopleKeys,...studentKeys,
  "رؤية المدرسة","رسالة المدرسة",
  "نبذة عامة عن المدرسة","الأهداف الاستراتيجية"
 ]);

 const extras=[];
 const seen=new Set();

 identityRows().forEach(row=>{
  Object.entries(row).forEach(([key,value])=>{
   if(!used.has(key)&&isFilled(value)){
    const unique=key+"|"+value;
    if(!seen.has(unique)){
     extras.push([key,value]);
     seen.add(unique);
    }
   }
  });
 });

 if(extras.length){
  html+=section("07 · مكونات المدرسة ومكنوناتها",
   `<div class="info-grid">${
    extras.map(([k,v])=>info(k,v)).join("")
   }</div>`
  );
 }

 html+=`<div class="card" style="text-align:center">
  <h2>من هوية المدرسة إلى تحليل أدائها</h2>
  <p>ننتقل الآن إلى قراءة الواقع المدرسي في مجالات التقويم الخمسة.</p>
  <button class="btn primary" onclick="navigate('overview')">
   الانتقال إلى التحليل الذاتي ←
  </button>
 </div>`;

 return html;
}

function renderOverview(){
 const domains=getDomains();
 const strengths=domains.reduce(
  (sum,d)=>sum+(d.strengths||[]).length,0
 );
 const improvements=domains.reduce(
  (sum,d)=>sum+(d.improvements||[]).length,0
 );

 let html=hero(
  "02 · SELF EVALUATION",
  "التحليل الذاتي للمدرسة",
  "قراءة شاملة للأداء المدرسي في ضوء مجالات التقويم الذاتي، وجوانب الإجادة والتحسين والأدلة الداعمة."
 );

 html+=`<div class="grid">
  ${stat("5","مجالات التقويم")}
  ${stat(strengths,"جوانب الإجادة المسجلة")}
  ${stat(improvements,"جوانب التحسين المسجلة")}
  ${stat(strengths+improvements,"إجمالي البنود المسجلة")}
 </div>`;

 html+=`<div class="domain-grid">`;

 domains.forEach((d,i)=>{
  const a=(d.strengths||[]).length;
  const b=(d.improvements||[]).length;

  html+=`<article class="domain-card">
   <div class="section-label">المجال ${i+1}</div>
   <h3>${escapeHTML(d.name)}</h3>
   <div class="counters">
    <span class="pill good">✦ جوانب الإجادة: ${a}</span>
    <span class="pill warn">◈ جوانب التحسين: ${b}</span>
   </div>
   <p>استعراض جوانب الإجادة، وفرص التحسين، والأدلة والشواهد.</p>
   <button class="btn primary" onclick="navigate('domain${i}')">
    استكشاف المجال ←
   </button>
  </article>`;
 });

 html+=`</div>`;

 html+=section("منهجية العرض",
  `<p>تستمد هذه المنصة بياناتها من جدول المدرسة.
  وتعرض البنود كما وردت في قاعدة البيانات، دون احتساب
  أحكام تقويمية أو نسب تحقق لم تسجلها المدرسة.</p>`
 );

 return html;
}

function entryCard(item,index,type){
 const text=normalize(item.text);
 const evidence=normalize(item.evidence);

 return `<div class="entry">
  <div class="section-label">
   ${type==="strength"?"جانب إجادة":"جانب يحتاج إلى تحسين"}
   · ${index+1}
  </div>
  <p>${textValue(text)}</p>
  ${evidence?`<div class="evidence">
   <strong>الدليل / الشاهد</strong>
   <div>${textValue(evidence)}</div>
  </div>`:""}
 </div>`;
}

function renderDomain(index){
 const d=getDomains()[index];
 if(!d)return renderOverview();

 const strengths=d.strengths||[];
 const improvements=d.improvements||[];

 let html=hero(
  `مجال التقويم ${index+1} من 5`,
  d.name,
  "تحليل جوانب الإجادة والجوانب التي تحتاج إلى تحسين، استنادًا إلى الأدلة المسجلة في قاعدة بيانات المدرسة."
 );

 html+=`<div class="grid">
  ${stat(strengths.length,"جوانب الإجادة")}
  ${stat(improvements.length,"جوانب التحسين")}
  ${stat(strengths.filter(x=>isFilled(x.evidence)).length,"أدلة الإجادة المدخلة")}
  ${stat(improvements.filter(x=>isFilled(x.evidence)).length,"أدلة التحسين المدخلة")}
 </div>`;

 html+=`<div class="entries">
  <section class="card">
   <h2 style="color:var(--green)">✦ جوانب الإجادة</h2>
   ${strengths.length
    ?strengths.map((x,i)=>entryCard(x,i,"strength")).join("")
    :'<div class="empty">لم تُدرج جوانب الإجادة في قاعدة البيانات بعد.</div>'
   }
  </section>

  <section class="card">
   <h2 style="color:var(--gold)">◈ جوانب التحسين</h2>
   ${improvements.length
    ?improvements.map((x,i)=>entryCard(x,i,"improvement")).join("")
    :'<div class="empty">لم تُدرج جوانب التحسين في قاعدة البيانات بعد.</div>'
   }
  </section>
 </div>`;

 html+=`<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
  <button class="btn" onclick="navigate('${index===0?"overview":"domain"+(index-1)}')">
   → السابق
  </button>
  <button class="btn primary"
   onclick="navigate('${index===4?"identity":"domain"+(index+1)}')">
   ${index===4?"العودة إلى هوية المدرسة":"المجال التالي ←"}
  </button>
 </div>`;

 return html;
}

function render(){
 renderNavigation();

 if(!database){
  $("app").innerHTML='<div class="loading">جارٍ تحميل البيانات...</div>';
  return;
 }

 if(currentPage==="identity"){
  $("app").innerHTML=renderIdentity();
 }else if(currentPage==="overview"){
  $("app").innerHTML=renderOverview();
 }else if(currentPage.startsWith("domain")){
  const i=Number(currentPage.replace("domain",""));
  $("app").innerHTML=renderDomain(i);
 }else{
  $("app").innerHTML=renderIdentity();
 }
}

function setStatus(message){
 $("status").textContent=message;
}

function validateData(data){
 return data&&data.success===true&&
 typeof data.sheets==="object"&&
 Array.isArray(data.domains);
}

function loadData(manual=false){
 const request=++requestNumber;

 setStatus("جارٍ الاتصال بجدول البيانات...");

 // Google Apps Script يدعم JSONP من خلال callback
 const callback="abuDardaaCallback_"+request;
 const script=document.createElement("script");

 let completed=false;

 const timeout=setTimeout(()=>{
  if(!completed)finishError("انتهت مهلة الاتصال");
 },18000);

 function cleanup(){
  clearTimeout(timeout);
  delete window[callback];
  script.remove();
 }

 function finishError(reason){
  if(completed)return;
  completed=true;
  cleanup();

  if(database){
   setStatus("تعذر التحديث؛ تُعرض آخر بيانات محفوظة. "+reason);
  }else{
   $("app").innerHTML=`
    <div class="card">
     <h2>تعذر تحميل بيانات المدرسة</h2>
     <p>تحقق من اتصال الإنترنت وصلاحية رابط Google Apps Script.</p>
     <button class="btn primary" onclick="loadData(true)">
      إعادة المحاولة
     </button>
    </div>`;
   setStatus(reason);
  }
 }

 window[callback]=function(data){
  if(completed)return;
  if(!validateData(data)){
   finishError("استجابة البيانات غير صالحة");
   return;
  }

  completed=true;
  cleanup();

  database=data;

  try{
   localStorage.setItem(CACHE_KEY,JSON.stringify(data));
  }catch(e){
   console.warn("تعذر حفظ النسخة المحلية",e);
  }

  render();

  const date=new Date();
  setStatus("آخر تحديث ناجح: "+date.toLocaleString("ar-OM"));

  if(manual){
   console.info("تم تحديث بيانات نبض الإجادة");
  }
 };

 script.onerror=()=>finishError("تعذر الوصول إلى خدمة البيانات");

 script.src=API_URL+
  "?callback="+encodeURIComponent(callback)+
  "&_="+Date.now();

 document.head.appendChild(script);
}

function togglePresentation(){
 presentation=!presentation;

 document.body.classList.toggle("fullscreen",presentation);

 if(presentation){
  document.documentElement.requestFullscreen?.().catch(()=>{});
 }else if(document.fullscreenElement){
  document.exitFullscreen?.();
 }
}

document.addEventListener("keydown",function(e){
 if(!presentation)return;

 const pages=[
  "identity","overview",
  "domain0","domain1","domain2","domain3","domain4"
 ];

 const i=pages.indexOf(currentPage);

 if(e.key==="ArrowLeft"){
  navigate(pages[Math.min(i+1,pages.length-1)]);
 }

 if(e.key==="ArrowRight"){
  navigate(pages[Math.max(i-1,0)]);
 }

 if(e.key==="Escape"){
  presentation=false;
  document.body.classList.remove("fullscreen");
 }
});

// استعادة آخر نسخة ناجحة عند فتح المنصة
try{
 const saved=localStorage.getItem(CACHE_KEY);
 if(saved){
  const parsed=JSON.parse(saved);
  if(validateData(parsed)){
   database=parsed;
   render();
   setStatus("تُعرض البيانات المحفوظة لحين التحديث");
  }
 }
}catch(e){
 console.warn("تعذر استعادة النسخة المحفوظة",e);
}

// قراءة أحدث البيانات من Google Sheets
loadData();
</script>
